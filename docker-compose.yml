# Sidenote + a self-hosted model (Ollama). Run:  docker compose up -d
# then once:  docker compose exec ollama ollama pull qwen2.5:7b
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # GPU (NVIDIA): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_BACKEND: openai
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:7b
      TRUST_PROXY: "1"   # only if this sits behind nginx/Caddy/Cloudflare, else remove
      MAX_QUESTIONS_PER_SESSION: "30"
    depends_on: [ollama]
    restart: unless-stopped

volumes:
  ollama:
